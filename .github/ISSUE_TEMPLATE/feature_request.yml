name: Feature Request
description: Suggest an enhancement for panopticon-console
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or what gap does it fill?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: markdown
    attributes:
      value: >
        Note: this project is deliberately zero-dependency (stdlib Python +
        vanilla JS, no framework/build step). A proposal that requires a new
        dependency should say so explicitly and explain why it's worth the
        scope change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
