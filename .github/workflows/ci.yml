name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check out central signed artifact fixtures
        uses: actions/checkout@v4
        with:
          repository: Panopticon-Co/panopticon-contracts
          ref: "62e8a7a1e42e6ff02da929842cc07ed48b80cb72"
          path: _artifact-contracts

      - name: Check client script and run Node tests
        env:
          PANOPTICON_CONTRACTS_DIR: _artifact-contracts
        run: |
          node --check static/app.js
          for test in tests/*.cjs; do
            echo "== $test"
            node "$test"
          done
