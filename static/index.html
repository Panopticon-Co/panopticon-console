<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panopticon Console</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: #121821;
    --border: #24303d;
    --text: #d7e0e8;
    --muted: #7c8a99;
    --critical: #ff4d4f;
    --high: #ff9f43;
    --medium: #f2d94e;
    --low: #4dd4ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.04em; }
  header .sub { color: var(--muted); font-size: 12px; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  main { padding: 16px 24px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: top;
  }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }
  tr:hover td { background: var(--panel); }
  td.rule { white-space: nowrap; font-weight: 600; }
  td.when { white-space: nowrap; color: var(--muted); }
  .sev { font-weight: 600; text-transform: uppercase; font-size: 11px; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
  .sev-critical { color: var(--critical); border: 1px solid var(--critical); }
  .sev-high { color: var(--high); border: 1px solid var(--high); }
  .sev-medium { color: var(--medium); border: 1px solid var(--medium); }
  .sev-low { color: var(--low); border: 1px solid var(--low); }
  .evidence { color: var(--muted); font-size: 12px; margin: 0; }
  .evidence div { white-space: pre-wrap; word-break: break-word; max-width: 560px; }
  .evidence .k { color: var(--text); }
  #empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .new-row td { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: rgba(255, 159, 67, 0.18); } to { background: transparent; } }
</style>
</head>
<body>
<header>
  <h1>PANOPTICON CONSOLE</h1>
  <span class="sub">V1 &mdash; detection-engine alert feed</span>
  <span id="status">connecting&hellip;</span>
</header>
<main>
  <div class="table-wrap">
    <table id="alerts-table" hidden>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Rule</th>
          <th>Severity</th>
          <th>MITRE</th>
          <th>Title</th>
          <th>Evidence</th>
        </tr>
      </thead>
      <tbody id="alerts-body"></tbody>
    </table>
  </div>
  <div id="empty">No alerts yet.</div>
</main>
<script src="/app.js"></script>
</body>
</html>
